<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <title>LIGHTLESS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="interfaz">
        <h1>LIGHTLESS</h1>
        <p>ENCONTRÁ UNA SALIDA.</p>
    </div>

    <canvas id="juego"></canvas>

    <!-- Controles tactiles: solo se muestran en dispositivos moviles. -->
    <div id="controles-moviles">
        <div id="zona-mirar" aria-label="Deslizá para girar la vista"></div>

        <div id="joystick" aria-label="Joystick de movimiento">
            <div id="joystick-stick"></div>
        </div>

        <button id="boton-interactuar" class="boton-tactil" type="button">
            INTERACTUAR
        </button>

        <button id="boton-reiniciar" class="boton-tactil" type="button" hidden>
            VOLVER A JUGAR
        </button>
    </div>

    <script src="game.js"></script>

</body>
</html>
